name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Static pages use the shared site chrome
        run: python3 scripts/site-chrome/apply.py --check
      - name: Inline scripts in static pages parse
        run: node scripts/check-inline-js.cjs $(ls public/*.html public/report/*.html | grep -v '^public/feedback.html$')
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
