name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Static pages use the shared site chrome
        run: python3 scripts/site-chrome/apply.py --check
      - name: No superseded figures (docs/DATA_REGISTER.md)
        run: python3 scripts/check-figures.py
      - name: Single-volume report matches its parts
        run: python3 scripts/report/compile.py --check
      - name: Assistant knowledge base matches the report
        run: |
          pip install --quiet beautifulsoup4 lxml
          python3 scripts/kb/build.py --check
      - name: Inline scripts in static pages parse
        run: node scripts/check-inline-js.cjs public/*.html public/report/*.html
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
