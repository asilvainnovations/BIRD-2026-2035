# BIRD 2026–2035 | Netlify deployment configuration
# Site domain: bird-boi.mtit-barmm.com
# Build from the repository root.
# Package manager: npm ONLY. Do not commit yarn.lock / pnpm-lock.yaml — Netlify
# auto-detects any yarn.lock and runs `yarn install` before this command, which
# is what broke the 2026-11-20 deploy.

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  # @supabase/supabase-js >= 2.110 declares engines.node ">=22.0.0".
  # Keep in sync with .nvmrc and package.json "engines".
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Home page: dist/index.html is the Investment Roadmap (scripts/postbuild-home.mjs).
# The BIRD Strategic Planning Platform (React SPA) is dist/platform.html, served at
# /platform; every other unknown path falls back to it so its routes keep working.
[[redirects]]
  from = "/platform"
  to = "/platform.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/platform.html"
  status = 200

# Long-lived caching is safe for Vite's content-hashed assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# HTML should revalidate so users receive new deployments promptly.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/platform.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"
